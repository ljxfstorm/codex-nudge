name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.22'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Prepare the locked environment and test
        run: |
          uv sync --locked
          uv run --locked python -m unittest discover -s tests -v
      - name: Run the source CLI
        run: |
          uv run --locked codex-nudge --version
          uv run --locked codex-nudge --state-dir "$RUNNER_TEMP/absent" diagnostics > "$RUNNER_TEMP/diagnostics.json"
          uv run --locked python -c 'import json, os, pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); report=json.loads((root/"diagnostics.json").read_text()); assert report["offline"] and report["authentication"]["record"]=="missing"; assert not (root/"absent").exists()'
