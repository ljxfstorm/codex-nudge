[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-nudge"
dynamic = ["version"]
description = "Observe Codex quota windows and explicitly wake idle five-hour windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["PyJWT[crypto]==2.15.1"]

[project.scripts]
codex-nudge = "quota_window.cli:main"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/quota_window/__init__.py" }]

[tool.hatch.version]
path = "src/quota_window/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quota_window"]
